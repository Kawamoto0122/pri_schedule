<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お手伝い管理 - Reward Tracker</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-area">
                <span class="material-icons-round icon">savings</span>
                <h1>お手伝い記録</h1>
            </div>
            <div class="date-display" id="currentDate"></div>
        </header>

        <main class="main-grid">
            <!-- Dashboard Section -->
            <section class="dashboard-section glass-panel">
                <div class="dashboard-header">
                    <h2><span class="material-icons-round">analytics</span> <span id="dashboardTitle">今月の状況</span></h2>
                    <div class="month-nav">
                        <button id="prevMonthBtn" class="nav-btn" title="前の月へ">
                            <span class="material-icons-round">chevron_left</span>
                        </button>
                        <button id="resetMonthBtn" class="nav-btn" title="今月へ戻る">
                            <span class="material-icons-round">today</span>
                        </button>
                        <button id="nextMonthBtn" class="nav-btn" title="次の月へ">
                            <span class="material-icons-round">chevron_right</span>
                        </button>
                    </div>
                </div>
                <div class="stats-grid" id="statsGrid">
                    <!-- Dynamic Stats Cards will be injected here -->
                    <div class="stat-card total">
                        <span class="label">合計金額</span>
                        <span class="value" id="totalAmount">¥0</span>
                    </div>
                </div>
                <div class="chart-container">
                    <!-- We'll visualize progress here with simple CSS bars later -->
                    <div class="progress-list" id="progressList"></div>
                </div>
            </section>

            <!-- Input Form Section -->
            <section class="input-section glass-panel">
                <h2><span class="material-icons-round">add_circle</span> 新しい記録</h2>
                <form id="rewardForm">
                    <div class="form-group">
                        <label for="registrant">登録者</label>
                        <div class="input-wrapper">
                            <span class="material-icons-round">person</span>
                            <input type="text" id="registrant" placeholder="例: 太郎" required list="registrantList">
                            <datalist id="registrantList">
                                <option value="來夏">
                                <option value="湊斗">
                                <option value="和奏">
                            </datalist>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="type">種類</label>
                        <div class="input-wrapper">
                            <span class="material-icons-round">category</span>
                            <select id="type" required
                                style="flex: 1; border: none; background: transparent; padding: 8px; outline: none; font-size: 1rem; color: var(--text-color);">
                                <option value="" disabled selected>作業を選択してください</option>
                                <option value="お風呂掃除">お風呂掃除</option>
                                <option value="食器洗い">食器洗い</option>
                                <option value="猫のトイレ掃除 ※1階&2階">猫のトイレ掃除 ※1階&2階</option>
                                <option value="ゴミ捨て">ゴミ捨て</option>
                                <option value="雑巾がけ床【1階】">雑巾がけ床【1階】</option>
                                <option value="雑巾がけ床【2階】">雑巾がけ床【2階】</option>
                                <option value="テスト80点以上">テスト80点以上</option>
                                <option value="テスト90点以上">テスト90点以上</option>
                                <option value="その他">その他</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="amount">金額 (円)</label>
                        <div class="input-wrapper">
                            <span class="material-icons-round">currency_yen</span>
                            <input type="number" id="amount" placeholder="100" min="0" required>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">
                        <span>登録する</span>
                        <span class="material-icons-round">arrow_forward</span>
                    </button>
                </form>
            </section>

            <!-- History List Section -->
            <section class="history-section glass-panel">
                <div class="section-header">
                    <h2><span class="material-icons-round">history</span> 最新の履歴</h2>
                    <button id="clearHistoryBtn" class="icon-btn" title="履歴をクリア" style="opacity: 0.5;">
                        <span class="material-icons-round">delete_sweep</span>
                    </button>
                </div>
                <div class="history-list-wrapper">
                    <ul class="history-list" id="historyList">
                        <!-- History items will be injected here -->
                        <li class="empty-state">まだ記録がありません</li>
                    </ul>
                </div>
            </section>
        </main>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">登録しました</div>

    <script src="script.js"></script>
</body>

</html>
